<!doctype html>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kelly's Science Communication Research Wall</title>
<link
  rel="stylesheet"
  href="https://esm.sh/@excalidraw/excalidraw@0.18.0/dist/prod/index.css"
/>
<style>
  html,
  body,
  #app {
    margin: 0;
    height: 100%;
  }

  /* The glass button from kneuroth.github.io (dark tone): a frosted slab whose
   rim cycles white plus two Rubik's cube colours. */
  @property --glow-angle {
    syntax: "<angle>";
    initial-value: 0deg;
    inherits: true;
  }
  @property --glow-a {
    syntax: "<color>";
    initial-value: #ff5800;
    inherits: true;
  }
  @property --glow-b {
    syntax: "<color>";
    initial-value: #0051ba;
    inherits: true;
  }
  @keyframes glowSpin {
    to {
      --glow-angle: 360deg;
    }
  }
  @keyframes glowCube {
    0%,
    100% {
      --glow-a: #ff5800;
      --glow-b: #0051ba;
    }
    25% {
      --glow-a: #ff5800;
      --glow-b: #009b48;
    }
    50% {
      --glow-a: #c41e3a;
      --glow-b: #009b48;
    }
    75% {
      --glow-a: #c41e3a;
      --glow-b: #0051ba;
    }
  }
  .glass-button {
    position: fixed;
    right: 16px;
    bottom: 16px;
    z-index: 10;
    isolation: isolate;
    padding: 0.7em 1.4em;
    border-radius: 1rem;
    color: rgb(165 197 222);
    font:
      600 14px/1 system-ui,
      sans-serif;
    letter-spacing: 0.02em;
    text-decoration: none;
    box-shadow: 0 10px 40px rgb(0 0 0 / 0.18);
    transition:
      transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
      box-shadow 0.28s ease,
      color 0.28s ease;
    animation:
      glowSpin 10s linear infinite,
      glowCube 16s linear infinite;
  }
  .glass-button::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -1;
    padding: 2px;
    border-radius: inherit;
    background: conic-gradient(
      from var(--glow-angle),
      #fff,
      var(--glow-a),
      var(--glow-b),
      #fff
    );
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
  }
  .glass-button::after {
    content: "";
    position: absolute;
    inset: 5px;
    z-index: -1;
    border-radius: calc(1rem - 5px);
    background: rgb(8 4 5 / 0.72);
    backdrop-filter: blur(6px) saturate(1.1);
  }
  .glass-button:hover,
  .glass-button:focus-visible {
    transform: scale(1.03);
    color: #fff;
    box-shadow:
      0 12px 44px rgb(0 0 0 / 0.22),
      0 0 18px color-mix(in srgb, transparent, var(--glow-a) 55%);
  }
  .glass-button:focus-visible {
    outline: 2px solid rgb(165 197 222);
    outline-offset: 3px;
  }
  .glass-button:active {
    transform: scale(0.98);
  }
  @media (prefers-reduced-motion: reduce) {
    .glass-button {
      animation: none;
    }
    .glass-button:hover,
    .glass-button:focus-visible,
    .glass-button:active {
      transform: none;
    }
  }
</style>
<div id="app"></div>
<a class="glass-button" href="https://kneuroth.github.io/kneuroth/"
  >My Website</a
>
<script type="module">
  import React from "https://esm.sh/react@18.3.1";
  import { createRoot } from "https://esm.sh/react-dom@18.3.1/client";
  import { Excalidraw } from "https://esm.sh/@excalidraw/excalidraw@0.18.0?deps=react@18.3.1,react-dom@18.3.1";
  import LZString from "https://esm.sh/lz-string@1.5.0";

  // source.md is the live symlink when served locally; wall/ is the committed copy.
  const text = (p) =>
    fetch(p).then((r) => (r.ok ? r.text() : Promise.reject(r)));
  const md = await text("source.md").catch(() => text("wall/wall.md"));

  const [, kind, body] = md.match(/```(compressed-json|json)\n([\s\S]*?)\n```/);
  const scene = JSON.parse(
    kind === "json"
      ? body
      : LZString.decompressFromBase64(body.replace(/\s/g, "")),
  );

  const files = {};
  for (const [, id, link] of md.matchAll(/^([0-9a-f]+): \[\[([^\]|]+)/gm)) {
    const blob = await fetch(
      "wall/files/" + encodeURIComponent(link.split("/").pop()),
    ).then((r) => r.blob());
    const dataURL = await new Promise((done) => {
      const reader = new FileReader();
      reader.onload = () => done(reader.result);
      reader.readAsDataURL(blob);
    });
    files[id] = { id, mimeType: blob.type, dataURL };
  }

  createRoot(document.getElementById("app")).render(
    React.createElement(Excalidraw, {
      initialData: {
        elements: scene.elements,
        appState: scene.appState,
        files,
      },
      // Open on the frame named "start", or on the whole wall if there isn't one.
      excalidrawAPI: (api) =>
        requestAnimationFrame(() => {
          const start = api
            .getSceneElements()
            .find((e) => e.type === "frame" && e.name === "start");
          api.scrollToContent(start, { fitToContent: true, animate: false });
        }),
      viewModeEnabled: true,
      zenModeEnabled: true,
    }),
  );
</script>
